    function formatBytes(bytes, decimals = 2) {
        if (!+bytes) return '0 Bytes';
        const k = 1024;
        const dm = decimals < 0 ? 0 : decimals;
        const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return `${parseFloat((bytes / Math.pow(k, i)).toFixed(dm))} ${sizes[i]}`;

          const credential = await navigator.credentials.create({ publicKey: pubKey });
          const credentialId = btoa(String.fromCharCode.apply(null, new Uint8Array(credential.rawId)));
          setEditProfile({...editProfile, credentialId: credentialId, fingerprintEnabled: true});

        } catch (err) { alert("Gagal mengaktifkan sidik jari."); }
      };

      const registerFingerprintTarget = async () => {
        try {
          if (!window.PublicKeyCredential) throw new Error("Perangkat tidak mendukung Fingerprint.");
          const challenge = new Uint8Array(32); window.crypto.getRandomValues(challenge);
          const userId = new Uint8Array(16); window.crypto.getRandomValues(userId);
          const pubKey = {
            challenge, rp: { name: "MABUNET", id: window.location.hostname },
            user: { id: userId, name: targetAdmin.username, displayName: targetAdmin.name },
            pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],
            authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" },
            timeout: 60000, attestation: "none"
          };
          const credential = await navigator.credentials.create({ publicKey: pubKey });
          const credentialId = btoa(String.fromCharCode.apply(null, new Uint8Array(credential.rawId)));
          setTargetAdmin({...targetAdmin, credentialId: credentialId, fingerprintEnabled: true});
          alert("Sidik Jari untuk admin ini tertaut pada perangkat ini! Tekan 'Simpan Data'.");

          if (!savedUser.fingerprintEnabled || !savedUser.credentialId) throw new Error('Sidik Jari belum diaktifkan.');
          
          const challenge = new Uint8Array(32); window.crypto.getRandomValues(challenge);
          const rawId = Uint8Array.from(atob(savedUser.credentialId), c => c.charCodeAt(0));
          const assertion = await navigator.credentials.get({
            publicKey: { challenge, rpId: window.location.hostname, allowCredentials: [{ type: "public-key", id: rawId }], userVerification: "required" }
          });
          if (assertion) { setCurrentUser(savedUser); setEditProfile(savedUser); localStorage.setItem('mabunet_session', savedUser.id); }

                          <div>
                              <label className="block text-[10px] font-bold text-slate-500 mb-1.5 ml-1">TYPE BINDING</label>
                              <select value={mikrotikForm.type} onChange={e => setMikrotikForm({...mikrotikForm, type: e.target.value})} className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-sm font-bold outline-none focus:border-kai-blue">
                                  <option value="bypassed">bypassed (Tanpa Login)</option>
                                  <option value="blocked">blocked (Blokir Total)</option>
                                  <option value="regular">regular (Normal)</option>
                              </select>
                          </div>
                      </>
                  )}
                  
                  {/* Fields umum (Comment & Server) */}
                  {(mikrotikFormType === 'hotspot_user' || mikrotikFormType === 'ip_binding') && (
                      <div>
                          <label className="block text-[10px] font-bold text-slate-500 mb-1.5 ml-1">SERVER</label>
                          <input type="text" value={mikrotikForm.server} onChange={e => setMikrotikForm({...mikrotikForm, server: e.target.value})} placeholder="all / hotspot1" className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-sm font-bold outline-none focus:border-kai-blue" />
                      </div>
                  )}

                  <div>
                      <label className="block text-[10px] font-bold text-slate-500 mb-1.5 ml-1">KOMENTAR / KETERANGAN</label>
                      <input type="text" value={mikrotikForm.comment} onChange={e => setMikrotikForm({...mikrotikForm, comment: e.target.value})} placeholder="Keterangan / Nama Pemilik" className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-sm font-bold outline-none focus:border-kai-blue" />
                  </div>
                  
                  <div className="flex gap-3 pt-4">
                    <button type="button" onClick={() => setIsMikrotikModalOpen(false)} className="flex-1 py-3 border border-slate-200 dark:border-slate-700 rounded-xl font-bold text-sm">Batal</button>
                    <button type="submit" className="flex-1 py-3 bg-kai-blue text-white rounded-xl font-bold text-sm shadow-lg">Execute</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {isCustomerModalOpen && (
            <div className="fixed inset-0 z-[60] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl w-full max-w-md p-6 md:p-8 shadow-2xl animate-in fade-in zoom-in-95 duration-200 max-h-[90vh] overflow-y-auto custom-scrollbar">
                <h3 className="text-xl font-extrabold mb-6 text-kai-blue dark:text-white">{editingCustomer ? 'Edit Data Pelanggan' : 'Pelanggan Baru'}</h3>
                <form onSubmit={handleSaveCustomer} className="space-y-4">
                  <div><label className="block text-[10px] font-bold text-slate-500 mb-1.5 ml-1">NAMA LENGKAP</label><input type="text" required value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-sm font-bold outline-none focus:border-kai-blue transition-colors" /></div>
                  <div className="flex gap-3">
                     <div className="flex-1"><label className="block text-[10px] font-bold text-slate-500 mb-1.5 ml-1">BLOK RUMAH</label><select value={formData.block} onChange={e => setFormData({...formData, block: e.target.value})} className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-sm font-bold outline-none focus:border-kai-blue">{BLOCKS.filter(b=>b!=='Semua Blok').map(b=><option key={b}>{b}</option>)}</select></div>
                     <div className="w-24"><label className="block text-[10px] font-bold text-slate-500 mb-1.5 ml-1">TEMPO TGL</label><input type="number" min="1" max="31" required value={formData.dueDate} onChange={e => setFormData({...formData, dueDate: Number(e.target.value)})} className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-sm font-bold text-center outline-none focus:border-kai-blue" /></div>
                  </div>
                  <div><label className="block text-[10px] font-bold text-slate-500 mb-1.5 ml-1">NO WHATSAPP</label><input type="text" required value={formData.phone} onChange={e => setFormData({...formData, phone: e.target.value})} placeholder="Contoh: 0812345678" className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-sm font-bold outline-none focus:border-kai-blue transition-colors" /></div>
                  <div><label className="block text-[10px] font-bold text-slate-500 mb-1.5 ml-1">USER PPPOE (MIKROTIK)</label><input type="text" required value={formData.pppoe_user || ''} onChange={e => setFormData({...formData, pppoe_user: e.target.value})} placeholder="b4.9@mabu.net" className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-sm font-bold outline-none focus:border-kai-blue transition-colors" /></div>
                  <div><label className="block text-[10px] font-bold text-slate-500 mb-1.5 ml-1">PAKET INTERNET</label><select value={formData.packageId} onChange={e => setFormData({...formData, packageId: e.target.value})} className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-sm font-bold outline-none focus:border-kai-blue transition-colors">{PACKAGES.map(p=><option key={p.id} value={p.id}>{p.label}</option>)}</select></div>
                  <div><label className="block text-[10px] font-bold text-slate-500 mb-1.5 ml-1">STATUS</label><select value={formData.status} onChange={e => setFormData({...formData, status: e.target.value})} className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-sm font-bold outline-none focus:border-kai-blue transition-colors"><option>Aktif</option><option>Non-Aktif</option></select></div>
                  <div className="flex gap-3 pt-4">
                    <button type="button" onClick={() => setIsCustomerModalOpen(false)} className="flex-1 py-3 border border-slate-200 dark:border-slate-700 rounded-xl font-bold text-sm">Batal</button>
                    <button type="submit" className="flex-1 py-3 bg-kai-blue text-white rounded-xl font-bold text-sm shadow-lg">Simpan Data</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {isExpenseModalOpen && (
            <div className="fixed inset-0 z-[60] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl w-full max-w-sm p-6 md:p-8 shadow-2xl animate-in fade-in zoom-in-95 duration-200 max-h-[90vh] overflow-y-auto custom-scrollbar">
                <h3 className="text-xl font-extrabold mb-6 text-kai-orange">{editingExpense ? 'Edit Jurnal Kas' : 'Catat Kas Keluar'}</h3>
                <form onSubmit={handleSaveExpense} className="space-y-4">
                  <div className="flex gap-3">
                     <div className="flex-1"><label className="block text-[10px] font-bold text-slate-500 mb-1.5 ml-1">TGL</label><input type="date" required value={expenseForm.date} onChange={e => setExpenseForm({...expenseForm, date: e.target.value})} className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-3 text-xs font-bold outline-none focus:border-kai-orange" /></div>
                     <div className="flex-1">
                        <label className="block text-[10px] font-bold text-slate-500 mb-1.5 ml-1">KATEGORI</label>
                        <select value={expenseForm.category} onChange={e => setExpenseForm({...expenseForm, category: e.target.value})} className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-3 text-xs font-bold outline-none focus:border-kai-orange">
                          <option>Belanja</option><option>Perbaikan/Pemasangan</option><option>Operasional</option><option>Fam</option>
                        </select>
                     </div>
                  </div>
                  
                  <div>
                    <label className="block text-[10px] font-bold text-slate-500 mb-1.5 ml-1">DIPROSES / DIAJUKAN OLEH</label>
                    <select value={expenseForm.applicantSelect} onChange={e => setExpenseForm({...expenseForm, applicantSelect: e.target.value})} className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-sm font-bold outline-none focus:border-kai-orange">
                      <option value="Ayah">1. Ayah</option><option value="Mamah">2. Mamah</option><option value="Fathir">3. Fathir</option><option value="Dede">4. Dede</option><option value="Zahra">5. Zahra</option><option value="Manual">6. Manual Tulis Keterangan</option>
                    </select>
                    {expenseForm.applicantSelect === 'Manual' && (
                      <input type="text" placeholder="Tulis nama pengaju manual..." required value={expenseForm.applicantCustom} onChange={e => setExpenseForm({...expenseForm, applicantCustom: e.target.value})} className="mt-3 w-full bg-orange-50 dark:bg-slate-800 border border-orange-200 dark:border-slate-700 rounded-xl px-4 py-3 text-sm font-bold outline-none focus:border-kai-orange" />
                    )}
                  </div>
                  <div><label className="block text-[10px] font-bold text-slate-500 mb-1.5 ml-1">URAIAN / CATATAN</label><input type="text" required value={expenseForm.description} onChange={e => setExpenseForm({...expenseForm, description: e.target.value})} placeholder="Misal: Beli kabel FO 1 Roll" className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-sm font-bold outline-none focus:border-kai-orange" /></div>
                  <div><label className="block text-[10px] font-bold text-slate-500 mb-1.5 ml-1">NOMINAL (RP)</label><input type="number" required value={expenseForm.amount} onChange={e => setExpenseForm({...expenseForm, amount: e.target.value})} placeholder="500000" className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-lg font-black text-rose-600 outline-none focus:border-rose-500" /></div>
                  
                  <div className="flex gap-3 pt-4">
                    <button type="button" onClick={() => setIsExpenseModalOpen(false)} className="flex-1 py-3 border border-slate-200 dark:border-slate-700 rounded-xl font-bold text-sm">Batal</button>
                    <button type="submit" className="flex-1 py-3 bg-kai-orange text-white rounded-xl font-bold text-sm shadow-lg">Simpan Kas</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {cropState.isOpen && (
            <div className="fixed inset-0 z-[70] bg-slate-900/60 backdrop-blur-sm flex flex-col items-center justify-center p-4">
              <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 w-full max-w-xs shadow-2xl animate-in zoom-in-95 duration-200">
                <h3 className="text-base font-extrabold mb-4 text-center">Atur Foto</h3>
                <div className="flex justify-center mb-4">
                  <div className="w-48 h-48 rounded-full overflow-hidden border-2 border-dashed border-kai-blue bg-slate-100 relative cursor-move touch-none" onMouseDown={handleCropDragStart} onMouseMove={handleCropDragMove} onMouseUp={handleCropDragEnd} onMouseLeave={handleCropDragEnd} onTouchStart={handleCropDragStart} onTouchMove={handleCropDragEnd} onTouchEnd={handleCropDragEnd}>
                    <img src={cropState.src} draggable="false" style={{ transform: `translate(calc(-50% + ${cropState.x}px), calc(-50% + ${cropState.y}px)) scale(${cropState.zoom})`, minWidth: '100%', minHeight: '100%', objectFit: 'cover', pointerEvents: 'none' }} className="absolute top-1/2 left-1/2 origin-center" />
                  </div>
                </div>
                <input type="range" min="1" max="3" step="0.1" value={cropState.zoom} onChange={(e) => setCropState({...cropState, zoom: parseFloat(e.target.value)})} className="w-full accent-kai-blue mb-4" />
                <div className="flex gap-2">
                  <button onClick={() => setCropState({...cropState, isOpen: false})} className="flex-1 py-2.5 rounded-xl border border-slate-200 font-bold text-xs">Batal</button>
                  <button onClick={applyCrop} className="flex-1 py-2.5 rounded-xl bg-kai-blue text-white font-bold text-xs">Simpan</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }
    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
