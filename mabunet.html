  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) { registration.unregister(); }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let name of names) caches.delete(name);
      });
    }
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: {} } }
  </script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    /* Mengunci layar agar tidak bisa digeser ke samping (No Slidebar) */
    html, body { max-width: 100%; overflow-x: hidden; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    .dark ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    .dark ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    @media print {
      body * { visibility: hidden; }
      #print-receipt, #print-receipt * { visibility: visible; }
      #print-receipt { position: absolute; left: 0; top: 0; width: 58mm; margin: 0; padding: 5px; font-family: monospace; font-size: 11px; color: #000; background: #fff; }

    }
  </style>

<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 antialiased min-h-screen transition-colors duration-300">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useRef } from 'https://esm.sh/react@18.2.0';
    import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
    import { 
      Users, LayoutDashboard, LogOut, Check, BookOpen, Fingerprint, Lock, User, Settings, Camera, ShieldAlert, ToggleLeft, ToggleRight,
      Bell, BellRing, Plus, Edit3, Trash2, FileText, Volume2, VolumeX, Server, Eye, EyeOff, Sun, Moon, Printer, Download, Activity, TrendingUp, UserCog, Crop, Wallet
    } from 'https://esm.sh/lucide-react@0.292.0';
    
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.6.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, addDoc, setDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.6.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCE-kFF6ZaDZ5UodX2MJfvooshQT8LH0ak",
      authDomain: "billing-mabunet.firebaseapp.com",
      projectId: "billing-mabunet",
      storageBucket: "billing-mabunet.firebasestorage.app",
      messagingSenderId: "362703627315",
      appId: "1:362703627315:web:a24bf8a6ba9d07f13e6f46",
      measurementId: "G-2DBSV96KHP"
    };

    let app, db;
    try {
      app = initializeApp(firebaseConfig);
      db = getFirestore(app);
    } catch(e) { console.error("Gagal Firebase:", e); }

    const INITIAL_ADMINS = [
      { id: 'admin1', username: 'Hilman', password: 'Kosong,19', name: 'Hilman Fatahillah', role: 'Super Admin', phone: '08999999977', email: 'hilman@mabunet.com', photo: '', status: 'Aktif', fingerprintEnabled: false, credentialId: '' },
      { id: 'admin2', username: 'admin2', password: '123', name: 'Admin Keuangan', role: 'Billing', phone: '081200000002', email: '', photo: '', status: 'Aktif', fingerprintEnabled: false, credentialId: '' }
    ];

    const PACKAGES = [
      { id: '5mbps_100', speed: '5 Mbps', price: 100000, label: '5 Mbps - Rp 100.000' },
      { id: '10mbps_150', speed: '10 Mbps', price: 150000, label: '10 Mbps - Rp 150.000' },
      { id: '10mbps_180', speed: '10 Mbps', price: 180000, label: '10 Mbps - Rp 180.000' },
      { id: '15mbps_200', speed: '15 Mbps', price: 200000, label: '15 Mbps - Rp 200.000' },
      { id: '20mbps_250', speed: '20 Mbps', price: 250000, label: '20 Mbps - Rp 250.000' },
      { id: '25mbps_300', speed: '25 Mbps', price: 300000, label: '25 Mbps - Rp 300.000' }
    ];
    const BLOCKS = ['Semua Blok', 'Mabu', 'Ranau', 'RG', 'Pesona', 'PLT'];
    const MONTHS = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
    const YEARS = [2024, 2025, 2026, 2027, 2028, 2029, 2030];

    function App() {
      const [admins, setAdmins] = useState(INITIAL_ADMINS);
      const [currentUser, setCurrentUser] = useState(null);
      const [loginForm, setLoginForm] = useState({ username: '', password: '' });
      const [loginError, setLoginError] = useState('');
      const [isScanning, setIsScanning] = useState(false);
      const [showPassword, setShowPassword] = useState(false); 
      const [isDarkMode, setIsDarkMode] = useState(true); 
      
      const [activeTab, setActiveTab] = useState('dashboard');
      const [ledgerTab, setLedgerTab] = useState('Jurnal'); 
      const [editProfile, setEditProfile] = useState({});
      const [isEditingProfile, setIsEditingProfile] = useState(false); 
      const [targetAdmin, setTargetAdmin] = useState(null);
      const [isTargetAdminModalOpen, setIsTargetAdminModalOpen] = useState(false);
      
      const [selectedYear, setSelectedYear] = useState(new Date().getFullYear());
      const [selectedMonth, setSelectedMonth] = useState(new Date().getMonth());
      const [searchTerm, setSearchTerm] = useState('');
      const [filterBlock, setFilterBlock] = useState('Semua Blok');

      const [customers, setCustomers] = useState([]);
      const [expenses, setExpenses] = useState([]);
      const [auditLogs, setAuditLogs] = useState([]); 
      const [isDbLoading, setIsDbLoading] = useState(true);
      
      const [printData, setPrintData] = useState(null);
      const [alarmEnabled, setAlarmEnabled] = useState(false);
      const audioRef = useRef(new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3'));

      const [isCustomerModalOpen, setIsCustomerModalOpen] = useState(false);
      const [isExpenseModalOpen, setIsExpenseModalOpen] = useState(false);
      
      const [formData, setFormData] = useState({ name: '', block: 'Mabu', phone: '', packageId: '10mbps_150', dueDate: 1, status: 'Aktif', notes: '', pppoe_user: '' });
      const [expenseForm, setExpenseForm] = useState({ date: new Date().toISOString().split('T')[0], category: 'Belanja', description: '', notes: '', amount: '' });
      const [editingCustomer, setEditingCustomer] = useState(null);

      const [cropState, setCropState] = useState({ isOpen: false, src: null, isTarget: false, zoom: 1, x: 0, y: 0 });
      const [isDragging, setIsDragging] = useState(false);
      const [dragStart, setDragStart] = useState({ x: 0, y: 0 });

      const formatIDR = (val) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(Number(val) || 0);
      const cleanPhone = (phoneStr) => { let p = String(phoneStr || '').replace(/\D/g, ''); if (p.startsWith('0')) p = '62' + p.substring(1); return p; };
      const currentPeriodKey = `${selectedYear}-${String(selectedMonth + 1).padStart(2, '0')}`;
      const getPackage = (pkgId) => PACKAGES.find(p => p.id === pkgId) || { speed: 'Custom', price: 0 };
      const todayDay = new Date().getDate();

      useEffect(() => {
        if (isDarkMode) document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      }, [isDarkMode]);

      const writeLog = async (actionDesc) => {
        if(!db || !currentUser) return;
        try { await addDoc(collection(db, 'logs'), { time: new Date().getTime(), dateStr: new Date().toLocaleString('id-ID'), admin: currentUser?.name || 'Sistem', action: actionDesc }); } catch(e) {}
      };

      useEffect(() => {
        if (!db) { setIsDbLoading(false); return; }
        try {
          const unsubAdmins = onSnapshot(collection(db, 'admins'), (snapshot) => {
            if (snapshot.empty) { INITIAL_ADMINS.forEach(async (adm) => { await setDoc(doc(db, 'admins', adm.id), adm); }); } 
            else {
              const cloudAdmins = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
              setAdmins(cloudAdmins);
              const sessionUid = localStorage.getItem('mabunet_session');
              setCurrentUser(prevUser => {
                const activeUid = prevUser ? prevUser.id : sessionUid;
                if (activeUid) {
                  const activeUser = cloudAdmins.find(a => a.id === activeUid);
                  if (activeUser && activeUser.status === 'Aktif') return activeUser;
                  else localStorage.removeItem('mabunet_session'); 
                }
                return null;
              });
            }
          });
          const unsubCustomers = onSnapshot(collection(db, 'customers'), (snapshot) => {
            const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            data.sort((a,b) => String(a?.block || '').localeCompare(String(b?.block || '')));
            setCustomers(data); setIsDbLoading(false);
          });
          const unsubExpenses = onSnapshot(collection(db, 'expenses'), (snapshot) => {
            const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            data.sort((a,b) => new Date(b?.date || 0) - new Date(a?.date || 0));
            setExpenses(data);
          });
          const unsubLogs = onSnapshot(collection(db, 'logs'), (snapshot) => {
            const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            data.sort((a,b) => (b?.time || 0) - (a?.time || 0)); 
            setAuditLogs(data);
          });
          return () => { unsubAdmins(); unsubCustomers(); unsubExpenses(); unsubLogs(); };
        } catch(e) { console.error(e); setIsDbLoading(false); }
      }, []);

      const togglePayment = async (custId, monthKey) => {
        if (!db) return;
        const cust = customers.find(c => c.id === custId);
        if(!cust) return;
        const isPaid = cust?.payments?.[monthKey];
        await updateDoc(doc(db, 'customers', custId), { [`payments.${monthKey}`]: !isPaid });
        writeLog(isPaid ? `Membatalkan lunas tagihan: ${cust.name}` : `Menandai LUNAS tagihan: ${cust.name}`);
      };

      const handleSaveCustomer = async (e) => {
        e.preventDefault();
        if (editingCustomer) { 
          await updateDoc(doc(db, 'customers', editingCustomer.id), formData); 
          writeLog(`Mengedit data pelanggan: ${formData.name}`);
        } else { 
          await addDoc(collection(db, 'customers'), { ...formData, payments: {} }); 
          writeLog(`Menambah pelanggan baru: ${formData.name}`);
        }
        setIsCustomerModalOpen(false);
      };

      const handleSaveExpense = async (e) => {
        e.preventDefault();
        await addDoc(collection(db, 'expenses'), { ...expenseForm, admin: currentUser?.name || 'Admin' });
        writeLog(`Mencatat kas keluar (${expenseForm.category}): ${formatIDR(expenseForm.amount)}`);
        setIsExpenseModalOpen(false);
      };

      const handleDeleteCustomer = async (id) => {
        const cust = customers.find(c => c.id === id);
        if(confirm("Yakin hapus pelanggan ini?")) { await deleteDoc(doc(db, 'customers', id)); writeLog(`Menghapus pelanggan: ${cust?.name}`); }
      };

      const handleDeleteExpense = async (id) => {
        if(confirm("Yakin hapus catatan pengeluaran ini?")) { await deleteDoc(doc(db, 'expenses', id)); writeLog(`Menghapus data pengeluaran`); }
      };

      const handleLogin = (e) => {
        if(e) e.preventDefault();
        setLoginError('');
        const user = admins.find(a => a.username === loginForm.username && a.password === loginForm.password);
        if (user) {
          if (user.status !== 'Aktif') return setLoginError('Akun Anda dinonaktifkan.');
          setCurrentUser(user); setEditProfile(user);
          localStorage.setItem('mabunet_session', user.id); 
          localStorage.setItem('mabunet_device_user', user.id); 
        } else { setLoginError('Username atau Password salah!'); }
      };

      const handleLogout = () => { setCurrentUser(null); localStorage.removeItem('mabunet_session'); };

      const registerFingerprint = async () => {
        try {
          if (!window.PublicKeyCredential) throw new Error("Perangkat tidak mendukung Fingerprint.");
          const challenge = new Uint8Array(32); window.crypto.getRandomValues(challenge);
          const userId = new Uint8Array(16); window.crypto.getRandomValues(userId);
          const pubKey = {
            challenge, rp: { name: "MABUNET", id: window.location.hostname }, user: { id: userId, name: editProfile.username, displayName: editProfile.name },
            pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }], authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" },
            timeout: 60000, attestation: "none"
          };
          const credential = await navigator.credentials.create({ publicKey: pubKey });
          const credentialId = btoa(String.fromCharCode.apply(null, new Uint8Array(credential.rawId)));
          setEditProfile({...editProfile, credentialId: credentialId, fingerprintEnabled: true});
          alert("Sidik Jari terkait! Tekan 'Simpan Profil'.");
        } catch (err) { alert("Gagal mengaktifkan sidik jari."); }
      };

      const handleFingerprintScan = async () => {
        setIsScanning(true); setLoginError('');
        try {
          const savedUserId = localStorage.getItem('mabunet_device_user');
          if (!savedUserId) throw new Error('Perangkat belum dikenali. Login Manual dahulu lalu seting di Profil.');
          const savedUser = admins.find(a => a.id === savedUserId);
          if (!savedUser || savedUser.status !== 'Aktif') throw new Error('Akun dinonaktifkan atau hilang.');
          if (!savedUser.fingerprintEnabled || !savedUser.credentialId) throw new Error('Sidik Jari belum diaktifkan.');
          const challenge = new Uint8Array(32); window.crypto.getRandomValues(challenge);
          const rawId = Uint8Array.from(atob(savedUser.credentialId), c => c.charCodeAt(0));
          const assertion = await navigator.credentials.get({ publicKey: { challenge, rpId: window.location.hostname, allowCredentials: [{ type: "public-key", id: rawId }], userVerification: "required" } });
          if (assertion) { setCurrentUser(savedUser); setEditProfile(savedUser); localStorage.setItem('mabunet_session', savedUser.id); }
        } catch (err) { setLoginError(err.message || 'Verifikasi Sidik Jari gagal.'); } finally { setIsScanning(false); }
      };

      const handlePhotoUploadInit = (e, isTargetAdmin = false) => {
        const file = e.target.files[0];
        if (file) { const reader = new FileReader(); reader.onloadend = () => { setCropState({ isOpen: true, src: reader.result, isTarget: isTargetAdmin, zoom: 1, x: 0, y: 0 }); }; reader.readAsDataURL(file); }
        e.target.value = null; 
      };

      const handleCropDragStart = (e) => { setIsDragging(true); const clientX = e.touches ? e.touches[0].clientX : e.clientX; const clientY = e.touches ? e.touches[0].clientY : e.clientY; setDragStart({ x: clientX - cropState.x, y: clientY - cropState.y }); };
      const handleCropDragMove = (e) => { if (!isDragging) return; const clientX = e.touches ? e.touches[0].clientX : e.clientX; const clientY = e.touches ? e.touches[0].clientY : e.clientY; setCropState(prev => ({ ...prev, x: clientX - dragStart.x, y: clientY - dragStart.y })); };
      const handleCropDragEnd = () => setIsDragging(false);

      const applyCrop = () => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas'); canvas.width = 400; canvas.height = 400; const ctx = canvas.getContext('2d');
          const scale = (400 / Math.min(img.width, img.height)) * cropState.zoom;
          const scaledW = img.width * scale; const scaledH = img.height * scale;
          const dx = (400 - scaledW) / 2 + (cropState.x * 2); const dy = (400 - scaledH) / 2 + (cropState.y * 2);
          ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 400, 400); ctx.drawImage(img, dx, dy, scaledW, scaledH);
          const finalDataUrl = canvas.toDataURL('image/jpeg', 0.8);
          if (cropState.isTarget) { setTargetAdmin({ ...targetAdmin, photo: finalDataUrl }); } else { setEditProfile({ ...editProfile, photo: finalDataUrl }); }
          setCropState({ ...cropState, isOpen: false });
        };
        img.src = cropState.src;
      };

      const handleSaveProfile = async (e) => {
        e.preventDefault();
        try {
          const updateData = { name: editProfile.name, username: editProfile.username, password: editProfile.password, email: editProfile.email || '', fingerprintEnabled: editProfile.fingerprintEnabled || false, credentialId: editProfile.credentialId || '', photo: editProfile.photo || '' };
          if (currentUser?.id === 'admin1') { updateData.phone = editProfile.phone; }
          await updateDoc(doc(db, 'admins', currentUser.id), updateData);
          alert('Profil berhasil diperbarui!'); setIsEditingProfile(false); 
        } catch (error) { alert('Gagal menyimpan profil.'); }
      };

      const handleSaveTargetAdmin = async (e) => {
        e.preventDefault();
        try {
          await updateDoc(doc(db, 'admins', targetAdmin.id), { name: targetAdmin.name, username: targetAdmin.username, password: targetAdmin.password, email: targetAdmin.email || '', phone: targetAdmin.phone || '', photo: targetAdmin.photo || '' });
          alert(`Profil ${targetAdmin.name} berhasil diperbarui!`); setIsTargetAdminModalOpen(false); writeLog(`Mengedit profil admin: ${targetAdmin.name}`);
        } catch (error) { alert('Gagal menyimpan data admin.'); }
      };

      const toggleAdminStatus = async (adminId, currentStatus) => {
        const newStatus = currentStatus === 'Aktif' ? 'Tidak Aktif' : 'Aktif';
        await updateDoc(doc(db, 'admins', adminId), { status: newStatus });
      };

      const exportCSV = (type) => {
        let csv = '';
        if (type === 'customers') {
          csv = 'Nama,Blok,Paket,Harga,Status\n'; customers.forEach(c => csv += `${c?.name || ''},${c?.block || ''},${getPackage(c?.packageId).speed},${getPackage(c?.packageId).price},${c?.status || ''}\n`);
        } else {
          csv = 'Tanggal,Kategori,Uraian,Nominal,Admin\n'; expenses.forEach(e => csv += `${e?.date || ''},${e?.category || ''},${e?.description || ''},${e?.amount || 0},${e?.admin || ''}\n`);
        }
        const blob = new Blob([csv], { type: 'text/csv' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `MABUNET_${type}_${new Date().toISOString().split('T')[0]}.csv`; a.click();
      };

      const triggerPrint = (cust) => { setPrintData(cust); setTimeout(() => { window.print(); setPrintData(null); }, 300); };

      const sendWAInvoice = (cust) => {
        if (!cust?.phone) return alert("Nomor HP pelanggan belum diisi!");
        const pkg = getPackage(cust?.packageId);
        const text = `*TAGIHAN MABUNET*\nYth. Bapak/Ibu: *${cust?.name || ''}* (Blok ${cust?.block || ''})\nBulan: *${MONTHS[selectedMonth]} ${selectedYear}*\nTagihan: *${formatIDR(pkg.price)}*\nJatuh Tempo: *Tgl ${cust?.dueDate}*\n\nMohon bayar tagihan internet Anda. Abaikan pesan ini jika sudah lunas.\n\nInfo & CS: wa.me/62811122699`;
        window.open(`https://wa.me/${cleanPhone(cust?.phone)}?text=${encodeURIComponent(text)}`, '_blank');
      };

      const sendWAReceipt = (cust, periodKey) => {
        if (!cust?.phone) return alert("Nomor HP pelanggan belum diisi!");
        const pkg = getPackage(cust?.packageId);
        const text = `*KUITANSI MABUNET*\nYth. Bapak/Ibu: *${cust?.name || ''}* (Blok ${cust?.block || ''})\n\nTerima kasih, pembayaran internet untuk bulan *${MONTHS[selectedMonth]} ${selectedYear}* sebesar *${formatIDR(pkg.price)}* telah kami terima dan berstatus *LUNAS*.\n\nInfo & CS: wa.me/62811122699`;
        window.open(`https://wa.me/${cleanPhone(cust?.phone)}?text=${encodeURIComponent(text)}`, '_blank');
      };
      
      const activeCustomersList = customers.filter(c => (c?.status || 'Aktif') === 'Aktif');
      const dueCustomers = activeCustomersList.filter(c => !c?.payments || !c?.payments[currentPeriodKey]).sort((a, b) => (Number(a?.dueDate) || 0) - (Number(b?.dueDate) || 0));
      const customersDueToday = dueCustomers.filter(c => Number(c?.dueDate) === todayDay);
      
      const totalPotentialRevenue = activeCustomersList.reduce((sum, c) => sum + (getPackage(c?.packageId)?.price || 0), 0);
      const actualPaidRevenue = activeCustomersList.filter(c => c?.payments?.[currentPeriodKey]).reduce((sum, c) => sum + (getPackage(c?.packageId)?.price || 0), 0);
      
      const currentMonthExpenses = expenses.filter(e => String(e?.date || '').startsWith(currentPeriodKey));
      const jurnalExpenses = currentMonthExpenses.filter(e => ['Belanja', 'Perbaikan/Pemasangan', 'Operasional'].includes(e?.category || ''));
      const famExpenses = currentMonthExpenses.filter(e => (e?.category || '') === 'Fam');
      
      const totalJurnal = jurnalExpenses.reduce((sum, e) => sum + Number(e?.amount || 0), 0);
      const totalFam = famExpenses.reduce((sum, e) => sum + Number(e?.amount || 0), 0);
      const totalExpenseAmount = totalJurnal + totalFam; 
      const netProfit = actualPaidRevenue - totalExpenseAmount; 
      
      const displayedExpenses = ledgerTab === 'Jurnal' ? jurnalExpenses : famExpenses;
      
      const chartData = [ { name: 'Potensi', Rp: totalPotentialRevenue }, { name: 'Masuk', Rp: actualPaidRevenue }, { name: 'Keluar', Rp: totalExpenseAmount }, { name: 'Net', Rp: netProfit } ];
      const maxChartVal = Math.max(...chartData.map(d => Math.abs(Number(d.Rp) || 0))) || 1;

      const filteredCustomers = customers.filter(c => {
        const matchSearch = String(c?.name || '').toLowerCase().includes(searchTerm.toLowerCase()) || String(c?.block || '').toLowerCase().includes(searchTerm.toLowerCase());
        const matchBlock = filterBlock === 'Semua Blok' ? true : String(c?.notes || '').includes(filterBlock) || String(c?.block || '').includes(filterBlock);
        return matchSearch && matchBlock;
      });

      useEffect(() => { if (alarmEnabled && customersDueToday.length > 0) audioRef.current.play().catch(e => console.log(e)); }, [alarmEnabled, customersDueToday.length]);

      if (!currentUser) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 md:p-8 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-slate-100 via-slate-200 to-slate-200 dark:from-slate-800 dark:via-slate-950 dark:to-slate-950 transition-colors duration-300">
            <div className="bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl border border-slate-300 dark:border-slate-800 p-8 md:p-10 rounded-3xl max-w-md w-full shadow-2xl relative overflow-hidden my-8">
              <div className="absolute -top-20 -right-20 w-40 h-40 md:w-56 md:h-56 bg-indigo-600/20 blur-3xl rounded-full"></div>
              {!db && ( <div className="mb-4 p-2 bg-amber-500/10 border border-amber-500/30 text-amber-600 dark:text-amber-400 text-xs md:text-sm rounded-lg text-center font-bold">⚠️ KONEKSI FIREBASE TERGANGGU. COBA REFRESH.</div> )}
              <button onClick={() => setIsDarkMode(!isDarkMode)} className="absolute top-4 right-4 md:top-6 md:right-6 text-slate-500 hover:text-indigo-500 transition-colors"><Sun className="w-5 h-5 md:w-6 md:h-6 hidden dark:block"/><Moon className="w-5 h-5 md:w-6 md:h-6 block dark:hidden"/></button>
              <div className="text-center mb-6 md:mb-8 relative z-10 flex flex-col items-center">
                <img src="./mabunetlogo.png" alt="MABUNET Logo" className="w-28 h-28 md:w-36 md:h-36 object-contain mb-4 drop-shadow-[0_0_15px_rgba(79,70,229,0.4)]" onError={(e) => { e.target.onerror = null; e.target.style.display = 'none'; }} />
                <h1 className="text-3xl md:text-4xl font-extrabold tracking-tight text-slate-800 dark:text-white">MABU<span className="text-indigo-600 dark:text-indigo-400">NET</span></h1>
                <p className="text-xs md:text-sm text-slate-500 dark:text-slate-400 mt-1 uppercase font-semibold">Real-time Cloud Gateway</p>
              </div>
              {loginError && <div className="mb-4 p-3 bg-rose-500/10 border border-rose-500/30 text-rose-600 dark:text-rose-400 text-xs md:text-sm rounded-xl flex items-center gap-2"><ShieldAlert className="w-4 h-4 md:w-5 md:h-5"/> {loginError}</div>}
              <form onSubmit={handleLogin} className="space-y-4 md:space-y-5 relative z-10 mt-6">
                <div className="relative">
                  <div className="absolute inset-y-0 left-0 pl-3 md:pl-4 flex items-center pointer-events-none text-slate-400 dark:text-slate-500"><User className="w-4 h-4 md:w-5 md:h-5" /></div>
                  <input type="text" placeholder="Username (misal: admin2)" required value={loginForm.username} onChange={e => setLoginForm({...loginForm, username: e.target.value})} className="w-full bg-slate-50 dark:bg-slate-950/50 border border-slate-300 dark:border-slate-700 rounded-xl pl-10 md:pl-12 pr-3 py-2.5 md:py-3 text-sm md:text-base outline-none focus:border-indigo-500 text-slate-800 dark:text-slate-100 transition-colors" />
                </div>
                <div className="relative">
                  <div className="absolute inset-y-0 left-0 pl-3 md:pl-4 flex items-center pointer-events-none text-slate-400 dark:text-slate-500"><Lock className="w-4 h-4 md:w-5 md:h-5" /></div>
                  <input type={showPassword ? "text" : "password"} placeholder="Password" required value={loginForm.password} onChange={e => setLoginForm({...loginForm, password: e.target.value})} className="w-full bg-slate-50 dark:bg-slate-950/50 border border-slate-300 dark:border-slate-700 rounded-xl pl-10 md:pl-12 pr-10 md:pr-12 py-2.5 md:py-3 text-sm md:text-base outline-none focus:border-indigo-500 text-slate-800 dark:text-slate-100 transition-colors" />
                  <button type="button" onClick={() => setShowPassword(!showPassword)} className="absolute inset-y-0 right-0 pr-3 md:pr-4 flex items-center text-slate-400 dark:text-slate-500 hover:text-indigo-600 dark:hover:text-indigo-400">{showPassword ? <EyeOff className="w-4 h-4 md:w-5 md:h-5"/> : <Eye className="w-4 h-4 md:w-5 md:h-5"/>}</button>
                </div>
                <button type="submit" className="w-full py-2.5 md:py-3 rounded-xl bg-indigo-600 text-white text-sm md:text-base font-bold shadow-lg hover:bg-indigo-700 transition-colors mt-2">Masuk Aplikasi</button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-slate-50 dark:bg-slate-950 flex flex-col relative transition-colors duration-300 text-sm md:text-base">
          <header className="md:hidden fixed top-0 inset-x-0 h-16 bg-white/90 dark:bg-slate-900/90 backdrop-blur-xl border-b border-slate-200 dark:border-slate-800 z-40 flex items-center justify-between px-4 shadow-sm dark:shadow-lg transition-colors">
            <div className="flex items-center gap-3">
              <img src="./mabunetlogo.png" alt="Mabunet" className="w-10 h-10 object-contain drop-shadow-md" onError={(e) => { e.target.onerror = null; e.target.style.display = 'none'; }} />
              <div><h2 className="font-bold text-sm leading-tight text-slate-800 dark:text-slate-200">MABUNET</h2><p className="text-[10px] text-indigo-600 dark:text-indigo-400 uppercase font-bold">{currentUser?.role || 'Admin'}</p></div>
            </div>
            <div className="flex items-center gap-3">
              <button onClick={() => setIsDarkMode(!isDarkMode)} className="text-slate-500 hover:text-indigo-500"><Sun className="w-5 h-5 hidden dark:block"/><Moon className="w-5 h-5 block dark:hidden"/></button>
              {db ? <Server className="w-5 h-5 text-emerald-500 dark:text-emerald-400" /> : <Server className="w-5 h-5 text-rose-500 dark:text-rose-400 animate-pulse" />}
            </div>
          </header>

          <aside className="fixed z-50 bg-white/90 dark:bg-slate-900/90 backdrop-blur-xl border-slate-200 dark:border-slate-800 flex items-center shadow-[0_-4px_24px_rgba(0,0,0,0.05)] dark:shadow-[0_0_24px_rgba(0,0,0,0.5)] inset-x-0 bottom-0 h-16 flex-row justify-around px-2 border-t transition-colors md:inset-y-0 md:left-0 md:w-20 md:h-screen md:flex-col md:justify-start md:py-6 md:px-0 md:border-r md:border-t-0 md:shadow-[4px_0_24px_rgba(0,0,0,0.05)]">
            <div className="hidden md:flex flex-col items-center mb-8 gap-2">
              <img src="./mabunetlogo.png" alt="Mabunet" className="w-12 h-12 md:w-14 md:h-14 object-contain drop-shadow-md" onError={(e) => { e.target.onerror = null; e.target.style.display = 'none'; }} />
            </div>
            <nav className="flex flex-row md:flex-col gap-2 md:gap-4 w-full md:px-4 items-center justify-around md:justify-start flex-1">
              <button onClick={() => {setActiveTab('dashboard'); setIsEditingProfile(false);}} className={`relative group flex justify-center p-3 rounded-xl transition-all ${activeTab === 'dashboard' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'}`}><LayoutDashboard className="w-5 h-5 md:w-6 md:h-6" /></button>
              <button onClick={() => {setActiveTab('customers'); setIsEditingProfile(false);}} className={`relative group flex justify-center p-3 rounded-xl transition-all ${activeTab === 'customers' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'}`}><div className="relative"><Users className="w-5 h-5 md:w-6 md:h-6" />{isDbLoading && <span className="absolute -top-1 -right-1 w-2 h-2 bg-indigo-400 rounded-full animate-pulse"></span>}</div></button>
              <button onClick={() => {setActiveTab('ledger'); setIsEditingProfile(false);}} className={`relative group flex justify-center p-3 rounded-xl transition-all ${activeTab === 'ledger' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'}`}><BookOpen className="w-5 h-5 md:w-6 md:h-6" /></button>
              <div className="hidden md:block w-full h-px bg-slate-200 dark:bg-slate-800 my-2"></div>
              <button onClick={() => {setActiveTab('settings'); setEditProfile(currentUser); setShowPassword(false);}} className={`relative group flex justify-center p-3 rounded-xl transition-all ${activeTab === 'settings' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'}`}>{currentUser?.photo ? <img src={currentUser.photo} className="w-[20px] h-[20px] md:w-[24px] md:h-[24px] rounded-full object-cover border border-slate-300 dark:border-slate-600" /> : <Settings className="w-5 h-5 md:w-6 md:h-6" />}</button>
              <button onClick={handleLogout} className="md:hidden relative group flex justify-center p-3 rounded-xl text-rose-500 hover:bg-rose-100 dark:hover:bg-rose-500/10 transition-all"><LogOut className="w-5 h-5" /></button>
            </nav>
            <div className="hidden md:flex mt-auto px-4 w-full flex-col gap-4 items-center">
              <button onClick={() => setIsDarkMode(!isDarkMode)} className="relative group flex justify-center p-3 rounded-xl text-amber-500 hover:bg-amber-100 dark:text-slate-400 dark:hover:bg-slate-800 transition-all"><Sun className="w-6 h-6 hidden dark:block"/><Moon className="w-6 h-6 block dark:hidden"/></button>
              <div className="relative group cursor-help">{db ? <Server className="w-5 h-5 text-emerald-500 dark:text-emerald-400" /> : <Server className="w-5 h-5 text-rose-500 dark:text-rose-400 animate-pulse" />}</div>
              <button onClick={handleLogout} className="relative group w-full flex justify-center p-3 rounded-xl text-rose-500 dark:text-rose-400 hover:bg-rose-100 dark:hover:bg-rose-500/10 transition-all"><LogOut className="w-6 h-6" /></button>
            </div>
          </aside>

          <main className="flex-1 w-full max-w-full overflow-y-auto overflow-x-hidden pt-20 pb-24 px-4 md:pt-10 md:pb-10 md:px-10 md:ml-20 space-y-6 md:space-y-8">
            
            {activeTab !== 'settings' && (
              <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-4 md:gap-6 bg-white dark:bg-slate-900 p-4 md:p-6 rounded-2xl border border-slate-200 dark:border-slate-800 transition-colors shadow-sm">
                <div className="flex items-center justify-between lg:justify-start gap-4 w-full lg:w-auto">
                  <h2 className="text-xl md:text-2xl font-bold">Periode Aktif</h2>
                  <button onClick={() => setAlarmEnabled(!alarmEnabled)} className={`flex items-center gap-2 px-3 md:px-4 py-1.5 md:py-2 rounded-lg text-xs md:text-sm font-bold border transition-colors ${alarmEnabled ? 'bg-emerald-100 dark:bg-emerald-500/20 text-emerald-600 dark:text-emerald-400 border-emerald-300 dark:border-emerald-500/50' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 border-slate-300 dark:border-slate-700'}`}>
                    {alarmEnabled ? <Volume2 className="w-4 h-4 md:w-5 md:h-5"/> : <VolumeX className="w-4 h-4 md:w-5 md:h-5"/>} <span className="hidden sm:inline">Alarm</span> {alarmEnabled ? 'ON' : 'OFF'}
                  </button>
                </div>
                <div className="flex items-center gap-2 w-full lg:w-auto">
                  <select value={selectedMonth} onChange={(e) => setSelectedMonth(Number(e.target.value))} className="w-full lg:w-auto bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl px-3 md:px-4 py-2 md:py-2.5 text-sm md:text-base outline-none transition-colors">{MONTHS.map((m, idx) => <option key={idx} value={idx}>{m}</option>)}</select>
                  <select value={selectedYear} onChange={(e) => setSelectedYear(Number(e.target.value))} className="w-full lg:w-auto bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl px-3 md:px-4 py-2 md:py-2.5 text-sm md:text-base outline-none transition-colors">{YEARS.map(y => <option key={y} value={y}>{y}</option>)}</select>
                </div>
              </div>
            )}

            {activeTab === 'dashboard' && (
              <div className="space-y-6 md:space-y-8">
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6">
                  <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 md:p-6 rounded-2xl shadow-sm transition-colors"><p className="text-xs md:text-sm text-slate-500 dark:text-slate-400">Total Pelanggan</p><h3 className="text-3xl md:text-4xl font-extrabold mt-1 md:mt-2">{customers.length || 0}</h3><p className="text-xs md:text-sm text-emerald-600 dark:text-emerald-400 mt-2">{activeCustomersList.length || 0} Aktif</p></div>
                  <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 md:p-6 rounded-2xl shadow-sm transition-colors"><p className="text-xs md:text-sm text-slate-500 dark:text-slate-400">Potensi Omset</p><h3 className="text-2xl md:text-3xl font-extrabold mt-1 md:mt-2 truncate">{formatIDR(totalPotentialRevenue)}</h3></div>
                  <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 md:p-6 rounded-2xl shadow-sm transition-colors"><p className="text-xs md:text-sm text-slate-500 dark:text-slate-400">Telah Terbayar</p><h3 className="text-2xl md:text-3xl font-extrabold text-emerald-600 dark:text-emerald-400 mt-1 md:mt-2 truncate">{formatIDR(actualPaidRevenue)}</h3></div>
                  <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 md:p-6 rounded-2xl shadow-sm transition-colors"><p className="text-xs md:text-sm text-slate-500 dark:text-slate-400">Kas Bersih (Net)</p><h3 className={`text-2xl md:text-3xl font-extrabold mt-1 md:mt-2 truncate ${netProfit >= 0 ? 'text-indigo-600 dark:text-indigo-400' : 'text-rose-600 dark:text-rose-400'}`}>{formatIDR(netProfit)}</h3></div>
                </div>

                <div className="hidden md:block bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-6 md:p-8 rounded-2xl shadow-xl transition-colors">
                  <h3 className="font-bold flex items-center gap-2 mb-6 text-indigo-600 dark:text-indigo-400 text-lg md:text-xl"><TrendingUp className="w-5 h-5 md:w-6 md:h-6"/> Grafik Keuangan Bulan Ini</h3>
                  <div className="flex items-end h-64 md:h-80 gap-6 pt-4 border-b border-slate-200 dark:border-slate-800 relative">
                    {chartData.map((data, index) => {
                       const height = maxChartVal > 0 ? (Math.abs(Number(data.Rp) || 0) / maxChartVal * 100) : 0;
                       const isNegative = (Number(data.Rp) || 0) < 0;
                       const color = index === 2 ? 'bg-rose-500' : index === 3 ? (isNegative ? 'bg-rose-500' : 'bg-indigo-500') : 'bg-emerald-500';
                       return (
                         <div key={index} className="flex-1 flex flex-col justify-end items-center group relative h-full">
                           <div className="absolute -top-8 opacity-0 group-hover:opacity-100 transition-opacity bg-slate-800 text-white text-[11px] md:text-sm font-bold py-1 md:py-1.5 px-3 md:px-4 rounded pointer-events-none z-10 whitespace-nowrap shadow-lg">{formatIDR(data.Rp)}</div>
                           <div className={`w-full max-w-[80px] md:max-w-[120px] ${color} rounded-t-md transition-all duration-500 hover:brightness-110`} style={{ height: `${height}%`, minHeight: '4px' }}></div>
                           <div className="absolute -bottom-8 text-xs md:text-sm font-semibold text-slate-500 text-center w-full truncate">{data.name}</div>
                         </div>
                       )
                    })}
                  </div>
                  <div className="mt-10"></div>
                </div>

                {customersDueToday.length > 0 && (
                  <div className="bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-500/50 p-5 md:p-6 rounded-2xl shadow-[0_4px_20px_rgba(244,63,94,0.1)] dark:shadow-[0_0_20px_rgba(244,63,94,0.2)] transition-colors">
                    <div className="flex items-center gap-4 md:gap-6">
                      <div className="p-3 md:p-4 bg-rose-200 dark:bg-rose-500/20 text-rose-600 dark:text-rose-400 rounded-full animate-ring"><BellRing className="w-7 h-7 md:w-8 md:h-8"/></div>
                      <div><h3 className="text-lg md:text-xl font-bold text-rose-700 dark:text-rose-400">Peringatan Jatuh Tempo! (Tgl {todayDay})</h3><p className="text-sm md:text-base text-slate-600 dark:text-slate-300 mt-1">Ada {customersDueToday.length} pelanggan yang harus ditagih hari ini.</p></div>
                    </div>
                  </div>
                )}

                <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl overflow-hidden shadow-xl transition-colors">
                  <div className="p-4 md:p-6 border-b border-slate-200 dark:border-slate-800"><h3 className="font-bold flex items-center gap-2 text-base md:text-lg"><Bell className="w-5 h-5 text-rose-500 dark:text-rose-400"/> Daftar Tagihan Belum Lunas ({dueCustomers.length})</h3></div>
                  <div className="w-full overflow-x-auto">
                    <table className="w-full text-left text-xs md:text-sm lg:text-base table-auto">
                      <thead>
                        <tr className="text-slate-500 dark:text-slate-400 border-b border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950">
                          <th className="py-2.5 px-3 md:py-4 md:px-6">Pelanggan</th>
                          <th className="py-2.5 px-3 md:py-4 md:px-6 hidden sm:table-cell">Tagihan</th>
                          <th className="py-2.5 px-3 md:py-4 md:px-6">Aksi</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                        {dueCustomers.map(cust => (
                          <tr key={cust.id} className={Number(cust?.dueDate) === todayDay ? 'bg-rose-50 dark:bg-rose-500/10' : 'hover:bg-slate-50 dark:hover:bg-slate-800/40'}>
                            <td className="py-2.5 px-3 md:py-4 md:px-6 break-words">
                              <div className="font-semibold text-slate-800 dark:text-slate-100 text-sm md:text-base">{cust?.name || 'Tanpa Nama'}</div>
                              <div className="text-[10px] md:text-xs bg-indigo-100 dark:bg-indigo-500/20 text-indigo-700 dark:text-indigo-300 px-1.5 py-0.5 md:px-2 md:py-1 rounded inline-block mt-0.5 md:mt-1">Blok {cust?.block || '-'}</div>
                              <div className="sm:hidden block text-rose-600 font-bold mt-1 text-[10px]">Rp {formatIDR(getPackage(cust?.packageId).price)}</div>
                            </td>
                            <td className="py-2.5 px-3 md:py-4 md:px-6 font-semibold whitespace-nowrap hidden sm:table-cell">{formatIDR(getPackage(cust?.packageId).price)}</td>
                            <td className="py-2.5 px-3 md:py-4 md:px-6 space-x-1.5 whitespace-nowrap">
                              <button onClick={() => sendWAInvoice(cust)} className="px-2.5 py-1.5 md:px-4 md:py-2 bg-rose-600 rounded-lg text-white text-[10px] md:text-sm font-semibold hover:bg-rose-700 shadow-sm transition-colors inline-flex">WA Tagih</button>
                              <button onClick={() => togglePayment(cust.id, currentPeriodKey)} className="px-2.5 py-1.5 md:px-4 md:py-2 bg-indigo-600 rounded-lg text-white text-[10px] md:text-sm font-semibold hover:bg-indigo-700 shadow-sm transition-colors inline-flex">Set Lunas</button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'customers' && (
              <div className="space-y-6 md:space-y-8">
                <div className="flex flex-col md:flex-row gap-4 md:gap-6 bg-white dark:bg-slate-900 p-4 md:p-6 rounded-2xl border border-slate-200 dark:border-slate-800 transition-colors shadow-sm">
                  <div className="flex flex-col sm:flex-row gap-4 w-full">
                    <input type="text" placeholder="Cari Nama/Blok..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} className="bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2.5 md:py-3 text-sm md:text-base flex-1 text-slate-800 dark:text-slate-100 outline-none focus:border-indigo-500 transition-colors"/>
                    <select value={filterBlock} onChange={e => setFilterBlock(e.target.value)} className="bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2.5 md:py-3 text-sm md:text-base text-slate-800 dark:text-slate-100 outline-none focus:border-indigo-500 transition-colors">{BLOCKS.map(b => <option key={b}>{b}</option>)}</select>
                  </div>
                  <div className="flex gap-2 w-full md:w-auto shrink-0 justify-end">
                    <button onClick={() => exportCSV('customers')} className="flex-1 md:flex-none px-4 py-2.5 md:py-3 bg-emerald-600 rounded-xl text-white text-sm md:text-base font-semibold shadow-lg hover:bg-emerald-700 flex items-center justify-center gap-2" title="Download Excel"><Download className="w-4 h-4 md:w-5 md:h-5"/> <span className="inline">Export</span></button>
                    <button onClick={() => { setEditingCustomer(null); setFormData({name: '', block: 'Mabu', phone: '', packageId: '10mbps_150', dueDate: 1, status: 'Aktif', notes: '', pppoe_user: ''}); setIsCustomerModalOpen(true); }} className="flex-1 md:flex-none px-4 py-2.5 md:py-3 bg-indigo-600 rounded-xl text-white text-sm md:text-base font-semibold shadow-lg hover:bg-indigo-700 flex items-center justify-center gap-2"><Plus className="w-4 h-4 md:w-5 md:h-5"/> <span className="inline">Tambah</span></button>
                  </div>
                </div>

                <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl overflow-x-auto w-full shadow-xl transition-colors">
                  {isDbLoading ? (
                    <div className="p-12 md:p-16 text-center text-slate-500 dark:text-slate-400 animate-pulse text-sm md:text-base">Memuat Data dari Cloud...</div>
                  ) : customers.length === 0 ? (
                    <div className="p-12 md:p-16 text-center text-rose-500 font-bold text-sm md:text-base">Data Pelanggan Kosong!</div>
                  ) : (
                    <table className="w-full text-left text-xs md:text-sm lg:text-base table-auto">
                      <thead className="bg-slate-50 dark:bg-slate-950 text-slate-500 dark:text-slate-400 border-b border-slate-200 dark:border-slate-800">
                        <tr>
                          <th className="py-2.5 px-3 md:py-4 md:px-6 w-auto">Pelanggan</th>
                          <th className="py-2.5 px-2 md:py-4 md:px-4 w-auto hidden sm:table-cell">Paket</th>
                          {MONTHS.map((m, i) => <th key={i} className="py-2.5 px-1 md:py-4 md:px-2 text-center text-[8px] md:text-xs uppercase tracking-wider hidden xl:table-cell">{m.substring(0,3)}</th>)}
                          <th className="py-2.5 px-3 md:py-4 md:px-6 text-right w-auto whitespace-nowrap">Opsi</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                        {filteredCustomers.map(cust => (
                          <tr key={cust.id} className="hover:bg-slate-50 dark:hover:bg-slate-800/40 transition-colors">
                            <td className="py-2 px-3 md:py-4 md:px-6 break-words">
                              <div className="font-semibold text-slate-800 dark:text-slate-100 text-sm md:text-base">{cust?.name || 'Tanpa Nama'}</div>

                              <div className="flex items-center gap-3 md:gap-4 w-full">
                                <div className="w-10 h-10 md:w-12 md:h-12 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden flex items-center justify-center shrink-0">{admin.photo ? <img src={admin.photo} className="w-full h-full object-cover" /> : <User className="w-5 h-5 md:w-6 md:h-6 text-slate-400" />}</div>
                                <div className="min-w-0"><p className="font-bold text-sm md:text-base text-slate-800 dark:text-slate-100 truncate">{admin.name || '-'}</p><p className="text-xs md:text-sm text-slate-500 dark:text-slate-400 mt-0.5 truncate">ID: <span className="text-slate-600 dark:text-slate-300 font-mono">{admin.username || '-'}</span></p></div>
                              </div>
                            </div>
                            <div className="flex items-center gap-2 md:gap-3 border-t border-slate-200 dark:border-slate-700 pt-3 md:pt-4 mt-auto">
                              <button onClick={() => { setTargetAdmin(admin); setIsTargetAdminModalOpen(true); }} className="flex-1 flex items-center justify-center gap-2 py-2 md:py-2.5 bg-indigo-50 dark:bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 rounded-xl text-xs md:text-sm font-bold hover:bg-indigo-100 dark:hover:bg-indigo-500/20 transition-colors"><UserCog className="w-4 h-4 md:w-5 md:h-5"/> Edit Profil</button>
                              <button onClick={() => toggleAdminStatus(admin.id, admin.status)} className={`flex-1 flex items-center justify-center gap-2 py-2 md:py-2.5 rounded-xl text-xs md:text-sm font-bold transition-all ${admin.status === 'Aktif' ? 'bg-emerald-100 dark:bg-emerald-500/20 text-emerald-600 dark:text-emerald-400' : 'bg-rose-100 dark:bg-rose-500/20 text-rose-600 dark:text-rose-400'}`}>
                                {admin.status === 'Aktif' ? 'Blokir' : 'Aktifkan'}
                                {admin.status === 'Aktif' ? <ToggleRight className="w-4 h-4 md:w-5 md:h-5"/> : <ToggleLeft className="w-4 h-4 md:w-5 md:h-5"/>}
                              </button>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>

                    <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 md:p-8 shadow-xl transition-colors">
                      <h3 className="text-lg md:text-xl font-bold mb-4 md:mb-6 flex items-center gap-2 text-indigo-600 dark:text-indigo-400"><Activity className="w-5 h-5 md:w-6 md:h-6"/> Riwayat Aktivitas Sistem (Log)</h3>
                      <div className="h-64 md:h-80 overflow-y-auto pr-2 md:pr-4">
                        {auditLogs.length === 0 ? (
                          <p className="text-center text-slate-500 py-10 md:py-14 text-sm md:text-base">Belum ada aktivitas tercatat.</p>
                        ) : (
                          <ul className="space-y-3 md:space-y-4">
                            {auditLogs.map((log) => (
                              <li key={log.id} className="flex flex-col sm:flex-row gap-1 sm:gap-3 md:gap-4 text-xs md:text-sm p-3 md:p-4 bg-slate-50 dark:bg-slate-950 rounded-xl border border-slate-100 dark:border-slate-800">
                                <div className="text-slate-400 w-full sm:w-24 md:w-28 shrink-0 text-[10px] md:text-xs font-mono">{log.dateStr || '-'}</div>
                                <div className="break-words"><span className="font-bold text-indigo-600 dark:text-indigo-400">{log.admin || '-'}</span>: <span className="text-slate-700 dark:text-slate-300 ml-1">{log.action || '-'}</span></div>
                              </li>
                            ))}
                          </ul>
                        )}
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}
          </main>

          {/* MODAL CROP PHOTO */}
          {cropState.isOpen && (
            <div className="fixed inset-0 z-[70] bg-slate-900/80 dark:bg-slate-950/90 flex flex-col items-center justify-center p-4">
              <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 md:p-8 max-w-sm md:max-w-md w-full shadow-2xl">
                <h3 className="text-lg md:text-xl font-bold mb-4 md:mb-6 flex items-center gap-2 text-indigo-600 dark:text-indigo-400"><Crop className="w-5 h-5 md:w-6 md:h-6"/> Atur Posisi Foto</h3>
                <div className="flex justify-center mb-6 md:mb-8">
                  <div className="w-48 h-48 md:w-64 md:h-64 rounded-full overflow-hidden border-2 border-dashed border-indigo-400 bg-slate-100 dark:bg-slate-800 relative cursor-move touch-none" onMouseDown={handleCropDragStart} onMouseMove={handleCropDragMove} onMouseUp={handleCropDragEnd} onMouseLeave={handleCropDragEnd} onTouchStart={handleCropDragStart} onTouchMove={handleCropDragMove} onTouchEnd={handleCropDragEnd}>
                    <img src={cropState.src} draggable="false" className="absolute top-1/2 left-1/2 origin-center" style={{ transform: `translate(calc(-50% + ${cropState.x}px), calc(-50% + ${cropState.y}px)) scale(${cropState.zoom})`, minWidth: '100%', minHeight: '100%', objectFit: 'cover', pointerEvents: 'none' }}/>
                  </div>
                </div>
                <div className="mb-6 md:mb-8"><label className="block text-xs md:text-sm font-semibold text-slate-500 mb-2 md:mb-3">Zoom / Perbesar</label><input type="range" min="1" max="3" step="0.1" value={cropState.zoom} onChange={(e) => setCropState({...cropState, zoom: parseFloat(e.target.value)})} className="w-full accent-indigo-600"/><p className="text-[10px] md:text-xs text-slate-400 text-center mt-2 md:mt-3">Geser foto (pan) dengan jari atau mouse.</p></div>
                <div className="flex gap-3 md:gap-4"><button onClick={() => setCropState({...cropState, isOpen: false})} className="flex-1 py-2.5 md:py-3 rounded-xl border border-slate-300 dark:border-slate-700 font-semibold text-sm md:text-base hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">Batal</button><button onClick={applyCrop} className="flex-1 py-2.5 md:py-3 rounded-xl bg-indigo-600 text-white font-semibold text-sm md:text-base hover:bg-indigo-700 transition-colors">Simpan Crop</button></div>
              </div>
            </div>
          )}

          {/* MODAL PELANGGAN */}
          {isCustomerModalOpen && (
            <div className="fixed inset-0 z-[60] bg-slate-900/50 dark:bg-slate-950/80 flex items-center justify-center p-4">
              <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl w-full max-w-md md:max-w-lg p-6 md:p-8 shadow-2xl transition-colors relative overflow-y-auto max-h-[90vh]">
                <h3 className="text-lg md:text-xl font-bold mb-4 md:mb-6 flex items-center gap-2">{editingCustomer ? 'Edit Pelanggan' : 'Tambah Pelanggan'}</h3>
                <form onSubmit={handleSaveCustomer} className="space-y-4 md:space-y-5">
                  <div><label className="block text-xs md:text-sm font-bold text-slate-600 dark:text-slate-400 mb-1.5">Nama</label><input type="text" required value={formData.name || ''} onChange={e => setFormData({...formData, name: e.target.value})} className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2.5 md:py-3 text-sm md:text-base outline-none focus:border-indigo-500 transition-colors" /></div>
                  <div><label className="block text-xs md:text-sm font-bold text-slate-600 dark:text-slate-400 mb-1.5">Blok</label><select value={formData.block || ''} onChange={e => setFormData({...formData, block: e.target.value})} className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2.5 md:py-3 text-sm md:text-base outline-none focus:border-indigo-500 transition-colors">{BLOCKS.filter(b=>b!=='Semua Blok').map(b=><option key={b}>{b}</option>)}</select></div>
                  <div><label className="block text-xs md:text-sm font-bold text-slate-600 dark:text-slate-400 mb-1.5">No HP</label><input type="text" required value={formData.phone || ''} onChange={e => setFormData({...formData, phone: e.target.value})} placeholder="Contoh: 0812345678" className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2.5 md:py-3 text-sm md:text-base outline-none focus:border-indigo-500 transition-colors" /></div>
                  <div><label className="block text-xs md:text-sm font-bold text-slate-600 dark:text-slate-400 mb-1.5">Username PPPoE MikroTik</label><input type="text" required value={formData.pppoe_user || ''} onChange={e => setFormData({...formData, pppoe_user: e.target.value})} placeholder="Contoh: b4.9@mabu.net" className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2.5 md:py-3 text-sm md:text-base outline-none focus:border-indigo-500 transition-colors" /></div>
                  <div><label className="block text-xs md:text-sm font-bold text-slate-600 dark:text-slate-400 mb-1.5">Paket</label><select value={formData.packageId || ''} onChange={e => setFormData({...formData, packageId: e.target.value})} className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2.5 md:py-3 text-sm md:text-base outline-none focus:border-indigo-500 transition-colors">{PACKAGES.map(p=><option key={p.id} value={p.id}>{p.label}</option>)}</select></div>
                  <div><label className="block text-xs md:text-sm font-bold text-slate-600 dark:text-slate-400 mb-1.5">Tgl Jatuh Tempo</label><input type="number" min="1" max="31" required value={formData.dueDate || 1} onChange={e => setFormData({...formData, dueDate: Number(e.target.value)})} className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2.5 md:py-3 text-sm md:text-base outline-none focus:border-indigo-500 transition-colors" /></div>
                  <div><label className="block text-xs md:text-sm font-bold text-slate-600 dark:text-slate-400 mb-1.5">Status</label><select value={formData.status || ''} onChange={e => setFormData({...formData, status: e.target.value})} className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2.5 md:py-3 text-sm md:text-base outline-none focus:border-indigo-500 transition-colors"><option>Aktif</option><option>Non-Aktif</option></select></div>
                  <div className="flex gap-3 md:gap-4 pt-4 md:pt-6"><button type="button" onClick={() => setIsCustomerModalOpen(false)} className="flex-1 py-2.5 md:py-3 border border-slate-300 dark:border-slate-700 rounded-xl font-bold text-sm md:text-base hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">Batal</button><button type="submit" className="flex-1 py-2.5 md:py-3 bg-indigo-600 text-white rounded-xl font-bold text-sm md:text-base hover:bg-indigo-700 shadow-lg transition-colors">Simpan</button></div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL KAS KELUAR */}
          {isExpenseModalOpen && (
            <div className="fixed inset-0 z-[60] bg-slate-900/50 dark:bg-slate-950/80 flex items-center justify-center p-4">
              <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl w-full max-w-sm md:max-w-md p-6 md:p-8 shadow-2xl transition-colors relative">
                <h3 className="text-lg md:text-xl font-bold mb-4 md:mb-6">Catat Kas Keluar</h3>
                <form onSubmit={handleSaveExpense} className="space-y-4 md:space-y-5">
                  <div><label className="block text-xs md:text-sm font-bold text-slate-600 dark:text-slate-400 mb-1.5">Tanggal</label><input type="date" required value={expenseForm.date || ''} onChange={e => setExpenseForm({...expenseForm, date: e.target.value})} className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2.5 md:py-3 text-sm md:text-base outline-none transition-colors" /></div>
                  <div><label className="block text-xs md:text-sm font-bold text-slate-600 dark:text-slate-400 mb-1.5">Kategori</label><select value={expenseForm.category || ''} onChange={e => setExpenseForm({...expenseForm, category: e.target.value})} className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2.5 md:py-3 text-sm md:text-base outline-none transition-colors"><option>Belanja</option><option>Perbaikan/Pemasangan</option><option>Operasional</option><option>Fam</option></select></div>
                  <div><label className="block text-xs md:text-sm font-bold text-slate-600 dark:text-slate-400 mb-1.5">Uraian / Deskripsi</label><input type="text" required value={expenseForm.description || ''} onChange={e => setExpenseForm({...expenseForm, description: e.target.value})} className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2.5 md:py-3 text-sm md:text-base outline-none transition-colors" /></div>
                  <div><label className="block text-xs md:text-sm font-bold text-slate-600 dark:text-slate-400 mb-1.5">Nominal (Rp)</label><input type="number" required value={expenseForm.amount || ''} onChange={e => setExpenseForm({...expenseForm, amount: e.target.value})} className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2.5 md:py-3 text-sm md:text-base outline-none transition-colors" /></div>
                  <div className="flex gap-3 md:gap-4 pt-4 md:pt-6"><button type="button" onClick={() => setIsExpenseModalOpen(false)} className="flex-1 py-2.5 md:py-3 border border-slate-300 dark:border-slate-700 rounded-xl font-bold text-sm md:text-base hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">Batal</button><button type="submit" className="flex-1 py-2.5 md:py-3 bg-rose-600 text-white rounded-xl font-bold text-sm md:text-base hover:bg-rose-700 shadow-lg transition-colors">Catat Kas</button></div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL EDIT ADMIN LAIN */}
          {isTargetAdminModalOpen && targetAdmin && (
            <div className="fixed inset-0 z-[60] bg-slate-900/50 dark:bg-slate-950/80 flex items-center justify-center p-4">
              <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl w-full max-w-sm md:max-w-md p-6 md:p-8 shadow-2xl transition-colors relative overflow-y-auto max-h-[90vh]">
                <h3 className="text-lg md:text-xl font-bold mb-4 md:mb-6 flex items-center gap-2 text-indigo-600 dark:text-indigo-400"><UserCog className="w-5 h-5 md:w-6 md:h-6"/> Edit {targetAdmin.role || '-'}</h3>
                <form onSubmit={handleSaveTargetAdmin} className="space-y-4 md:space-y-5">
                  <div className="flex items-center gap-4 md:gap-6 mb-4 md:mb-6">
                    <div className="relative w-16 h-16 md:w-20 md:h-20 rounded-full border-2 md:border-4 border-indigo-500 overflow-hidden bg-slate-100 dark:bg-slate-800 flex items-center justify-center group shrink-0">
                      {targetAdmin.photo ? <img src={targetAdmin.photo} className="w-full h-full object-cover" /> : <User className="w-6 h-6 md:w-8 md:h-8 text-slate-400" />}
                      <label className="absolute inset-0 bg-black/60 flex items-center justify-center opacity-0 group-hover:opacity-100 cursor-pointer transition-opacity"><Camera className="w-4 h-4 md:w-5 md:h-5 text-white" /><input type="file" accept="image/*" onChange={(e) => handlePhotoUploadInit(e, true)} className="hidden" /></label>
                    </div>
                    <div className="min-w-0"><p className="text-sm md:text-base font-semibold truncate">Foto Profil</p><p className="text-[10px] md:text-xs text-slate-500 dark:text-slate-400 mt-0.5 truncate">Pilih foto & atur posisi.</p></div>
                  </div>
                  <div><label className="block text-[11px] md:text-xs font-bold text-slate-500 dark:text-slate-400 mb-1.5">Nama Lengkap</label><input type="text" required value={targetAdmin.name || ''} onChange={e => setTargetAdmin({...targetAdmin, name: e.target.value})} className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2.5 md:py-3 text-sm md:text-base outline-none transition-colors" /></div>
                  <div><label className="block text-[11px] md:text-xs font-bold text-slate-500 dark:text-slate-400 mb-1.5">Username Login</label><input type="text" required value={targetAdmin.username || ''} onChange={e => setTargetAdmin({...targetAdmin, username: e.target.value})} className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2.5 md:py-3 text-sm md:text-base outline-none transition-colors" /></div>
                  <div><label className="block text-[11px] md:text-xs font-bold text-slate-500 dark:text-slate-400 mb-1.5">Password</label><input type="text" required value={targetAdmin.password || ''} onChange={e => setTargetAdmin({...targetAdmin, password: e.target.value})} className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2.5 md:py-3 text-sm md:text-base outline-none transition-colors" /></div>
                  <div><label className="block text-[11px] md:text-xs font-bold text-slate-500 dark:text-slate-400 mb-1.5">Email</label><input type="email" value={targetAdmin.email || ''} onChange={e => setTargetAdmin({...targetAdmin, email: e.target.value})} className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2.5 md:py-3 text-sm md:text-base outline-none transition-colors" /></div>
                  <div><label className="block text-[11px] md:text-xs font-bold text-slate-500 dark:text-slate-400 mb-1.5">No WhatsApp</label><input type="text" value={targetAdmin.phone || ''} onChange={e => setTargetAdmin({...targetAdmin, phone: e.target.value})} className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2.5 md:py-3 text-sm md:text-base outline-none transition-colors" /></div>
                  <div className="flex gap-3 md:gap-4 pt-4 md:pt-6"><button type="button" onClick={() => setIsTargetAdminModalOpen(false)} className="flex-1 py-2.5 md:py-3 rounded-xl border border-slate-300 dark:border-slate-700 font-bold text-sm md:text-base hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">Batal</button><button type="submit" className="flex-1 py-2.5 md:py-3 rounded-xl bg-indigo-600 text-white font-bold text-sm md:text-base shadow-lg hover:bg-indigo-700 transition-colors">Simpan Data</button></div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { hasError: false, error: null }; }
      static getDerivedStateFromError(error) { return { hasError: true, error }; }
      render() {
        if (this.state.hasError) {
          return (
            <div style={{minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', backgroundColor: '#fff1f2', padding: '24px'}}>
              <div style={{backgroundColor: 'white', padding: '32px', borderRadius: '16px', boxShadow: '0 10px 25px -5px rgba(0,0,0,0.1)', maxWidth: '500px', width: '100%', border: '1px solid #ffe4e6'}}>
                <h2 style={{fontSize: '24px', fontWeight: 'bold', color: '#e11d48', marginBottom: '16px'}}>Aplikasi Terhenti (Error)</h2>
                <div style={{backgroundColor: '#0f172a', color: '#38bdf8', padding: '16px', borderRadius: '12px', fontSize: '12px', fontFamily: 'monospace', overflow: 'auto', marginBottom: '24px'}}>
                  {this.state.error ? String(this.state.error) : 'Unknown Render Error'}
                </div>
                <button onClick={() => window.location.reload(true)} style={{padding: '10px 24px', backgroundColor: '#e11d48', color: 'white', fontWeight: 'bold', borderRadius: '12px', border: 'none', cursor: 'pointer'}}>Muat Ulang Layar</button>
              </div>
            </div>
          );
        }
        return this.props.children; 
      }
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<ErrorBoundary><App /></ErrorBoundary>);
  </script>
</body>
</html>
